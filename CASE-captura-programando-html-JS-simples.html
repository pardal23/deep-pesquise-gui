<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Captura de Imagem, Vídeo e Contas</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; background: #fafafa; }
        .content-box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        img, video { max-width: 100%; border-radius: 6px; display: block; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- AS CRASES CAPTURAM AS CONTAS E TAMBÉM AS TAGS DE IMAGEM E VÍDEO -->
    <div class="content-box">
        `${23 * 67 / 4}`
    </div>

    <div class="content-box">
        <h3>Imagem Capturada nas Crases:</h3>
        `${ '<img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgmK5KNhpuylyQqskmAP9s2M5OXG8AY0KPIWkY80s1-Oy2R-dReUk7zMWtyuBaBqx1FlVtqie17rx1WIc9vfcmDUlggZ3RBwXj3irtflY3lxwNCRRzzaQ6LHCJz_vYHxkOOzMiYYxkhvhs/w1200-h630-p-k-no-nu/planetaazul.jpg" alt="Imagem Dinâmica">' }`
    </div>

    <div class="content-box">
        <h3>Vídeo Capturado nas Crases:</h3>
        `${ '<iframe width="839" height="472" src="https://www.youtube.com/embed/anRTek3Au-0" title="A Magia Negra não funciona mais contra você. A Matrix está confusa." frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>' }`
    </div>


    <!-- O MOTOR JS QUE FAZ A MÁGICA -->
    <script>
        (function superFunction() {
            // Varre o HTML do body procurando pelo padrão de crases ``
            document.body.innerHTML = document.body.innerHTML.replace(/`([^`]+)`/g, (match, expressao) => {
                try {
                    // Executa o JS que está dentro do ${} seja ele uma conta ou uma tag HTML em formato string
                    return expressao.replace(/\${([\s\S]+?)}/g, (_, codigo) => Function(`return (${codigo})`)());
                } catch (e) {
                    return match; // Se falhar, mantém o texto original
                }
            });
        })();
    </script>

</body>
</html>
